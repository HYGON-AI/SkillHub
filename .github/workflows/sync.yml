name: Sync Opt-in Product Skills

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-opt-in-product-skills
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Require synchronization App configuration
        env:
          APP_ID: ${{ vars.SKILLHUB_APP_ID }}
          APP_KEY: ${{ secrets.SKILLHUB_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::Configure SKILLHUB_APP_ID and SKILLHUB_APP_PRIVATE_KEY; App-authored PRs must trigger quality checks."
            exit 1
          fi
      - name: Create catalog-scoped App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SKILLHUB_APP_ID }}
          private-key: ${{ secrets.SKILLHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Configure GitHub authentication
        env:
          GH_TOKEN: ${{ secrets.SKILLHUB_SYNC_TOKEN || github.token }}
        run: gh auth setup-git
      - name: Mirror registered skills
        run: |
          python scripts/sync_sources.py
          python scripts/generate_catalog.py
          python -m unittest discover -s tests
          python scripts/validate_skills.py
          python scripts/validate_agent_skills_spec.py
          python scripts/generate_catalog.py --check
          python scripts/sync_sources.py --check
      - name: Open or update synchronization pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No catalog changes."
            exit 0
          fi
          branch="automation/sync-product-skills"
          gh auth setup-git
          git config user.name "hygon-skillhub-bot"
          git config user.email "hygon-skillhub-bot@users.noreply.github.com"
          git checkout -B "$branch"
          git add skills catalog.json skills.sh.json README.md .skillhub-lock.json
          git commit --signoff -m "chore(skills): sync registered sources"
          expected=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          git push --force-with-lease="refs/heads/$branch:$expected" origin "$branch"
          gh pr create --base main --head "$branch" --title "chore(skills): sync registered sources" --body "Update registered GitHub skill mirrors. Quality, catalog and DCO checks plus maintainer review are required before merge." || \
            gh pr edit "$branch" --title "chore(skills): sync registered sources" --body "Update registered GitHub skill mirrors. Quality, catalog and DCO checks plus maintainer review are required before merge."
