name: Sync Opt-in Product Skills

on:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'
    # Temporary 2026-09-21 probe: 14:23/33/43/53 Asia/Shanghai.
    # Cron has no year field; remove this entry and probe job after diagnosis.
    - cron: '23,33,43,53 6 21 9 *'

permissions:
  contents: read

concurrency:
  group: sync-opt-in-product-skills
  cancel-in-progress: false

jobs:
  schedule-probe:
    if: github.event_name == 'schedule' && github.event.schedule == '23,33,43,53 6 21 9 *'
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Record scheduler delivery without repository writes
        env:
          PROBE_EVENT: ${{ github.event_name }}
          PROBE_SCHEDULE: ${{ github.event.schedule }}
          PROBE_SHA: ${{ github.sha }}
        run: |
          if [ "$(date -u +%F)" != '2026-09-21' ]; then
            echo 'Probe window expired; remove the temporary schedule configuration.'
            exit 0
          fi
          date -u '+Observed UTC: %Y-%m-%dT%H:%M:%SZ'
          printf 'Event: %s\nSchedule: %s\nCommit: %s\n' "$PROBE_EVENT" "$PROBE_SCHEDULE" "$PROBE_SHA"
          echo 'Read-only schedule probe: no checkout, secrets, sync, push or PR mutation.'
  sync:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '17 1 * * *' && vars.SKILLHUB_SYNC_ENABLED == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Require synchronization App configuration
        env:
          APP_ID: ${{ vars.SKILLHUB_APP_ID }}
          APP_KEY: ${{ secrets.SKILLHUB_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::Configure SKILLHUB_APP_ID and SKILLHUB_APP_PRIVATE_KEY; App-authored PRs must trigger quality checks."
            exit 1
          fi
      - name: Create catalog-scoped App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.SKILLHUB_APP_ID }}
          private-key: ${{ secrets.SKILLHUB_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Configure GitHub authentication
        env:
          GH_TOKEN: ${{ secrets.SKILLHUB_SYNC_TOKEN || github.token }}
        run: gh auth setup-git
      - name: Mirror registered skills
        run: |
          python scripts/sync_sources.py
          python scripts/generate_catalog.py
          python -m unittest discover -s tests
          python scripts/validate_skills.py
          python scripts/validate_agent_skills_spec.py
          python scripts/generate_catalog.py --check
          python scripts/sync_sources.py --check --locked
      - name: Open or update synchronization pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No catalog changes."
            exit 0
          fi
          branch="automation/sync-product-skills"
          gh auth setup-git
          git config user.name "hygon-skillhub-bot"
          git config user.email "hygon-skillhub-bot@users.noreply.github.com"
          git checkout -B "$branch"
          git add skills catalog.json skills.sh.json README.md .skillhub-lock.json
          git commit --signoff -m "chore(skills): sync registered sources"
          expected=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          if [ -n "$expected" ]; then
            git fetch origin "$expected"
            if git diff --quiet "$expected" HEAD; then
              echo "Existing synchronization branch already contains this update."
              exit 0
            fi
          fi
          git push --force-with-lease="refs/heads/$branch:$expected" origin "$branch"
          gh pr create --base main --head "$branch" --title "chore(skills): sync registered sources" --body "Update registered GitHub skill mirrors. Quality, catalog and DCO checks plus maintainer review are required before merge." || \
            gh pr edit "$branch" --title "chore(skills): sync registered sources" --body "Update registered GitHub skill mirrors. Quality, catalog and DCO checks plus maintainer review are required before merge."
